name: Deploy bu docker


env:
  VPS_IP: 91.218.230.97
  VPS_USERNAME: root
  DIR: /home/docker
  GIT_BRANCH: origin/cicd_to_ihc_docker24


on:
  push:
    branches:
      - cicd_to_ihc_docker24



jobs:

  deploy:
    runs-on: ubuntu-latest
    outputs:
      rebuild_needed: ${{ steps.check_commit.outputs.rebuild }}
    steps:

      - name: Check commit message
        id: check_commit
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[rebuild]"* ]]; then
            echo "rebuild_needed=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild_needed=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.event.head_commit.message }}" == *"[re2305master]"* ]]; then
            echo "rebuild2305master=true" >> $GITHUB_OUTPUT
          else
            echo "rebuild2305master=false" >> $GITHUB_OUTPUT
          fi

          if [[ "${{ github.event.head_commit.message }}" == *"[reCaddy]"* ]]; then
            echo "rebuildCaddy=true" >> $GITHUB_OUTPUT
          else
            echo "rebuildCaddy=false" >> $GITHUB_OUTPUT
          fi

      - name: "refresh git & restart docker"
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_IP }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}
          script: |
            cd ${{ env.DIR }}
            git fetch --all
            git reset --hard ${{ env.GIT_BRANCH }}

  deploy_composer:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      matrix:
        include:
          - rebuild: ${{ needs.deploy.outputs.rebuild_needed }}
          - rebuild2305master: ${{ needs.deploy.outputs.rebuild2305master }}
          - rebuildCaddy: ${{ needs.deploy.outputs.rebuildCaddy }}
    steps:
      - name: Conditional steps
        uses: appleboy/ssh-action@master
        with:

          host: ${{ env.VPS_IP }}
          username: ${{ env.VPS_USERNAME }}
          key: ${{ secrets.DEPLOY_KEY_DOCKER24 }}

          script: |
            cd ${{ env.DIR }}

#            ${{ needs.deploy.outputs.rebuild2305master == 'true' && 'echo "Rebuilding 2503master" && make d-rebuild-2503master' || 'echo "Skipping 2503master rebuild"' }}
#            ${{ needs.deploy.outputs.rebuild_needed == 'true' && 'echo "Full rebuild started" && make prod' || 'echo "Skipping full rebuild"' }}
#            ${{ needs.deploy.outputs.rebuildCaddy == 'true' && 'echo "Updating Caddy config" && docker-compose up -d caddy && docker cp ./caddy/Caddyfile caddy:/etc/caddy/Caddyfile && docker exec caddy caddy reload --config /etc/caddy/Caddyfile' || 'echo "Skipping Caddy update"' }}

            if [ "${{ matrix.rebuild2305master }}" = "true" ]; then
              echo "re2305master"
              make d-rebuild-2503master
            fi

            if [ "${{ matrix.rebuild }}" = "true" ]; then
              echo "Full rebuild started"
              make prod
              #docker-compose down
              #docker-compose up -d --build
            fi

            if [ "${{ matrix.rebuildCaddy }}" = "true" ]; then
              echo "Обновление конфигурации Caddy"
              docker-compose up
              docker cp ./caddy/Caddyfile caddy:/etc/caddy/Caddyfile
              docker exec caddy caddy reload --config /etc/caddy/Caddyfile
            fi

  sms_start:
    runs-on: ubuntu-latest
    steps:
      - name: send telega
        uses: appleboy/telegram-action@master
        with:
          # to: ${{ secrets.TELEGRAM_TO }}
          to: 360209578, phpcat,
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🐥🐥🐥 ${{ github.repository }} 
            ${{ github.event_name }} > ${{ github.event.head_commit.message }}
            👨🏻‍💻 ${{github.actor}} (${{ github.run_id }})

  sms_end:
    runs-on: ubuntu-latest
    # needs: [deploy_composer, deploy_npm]
    needs: deploy_composer

    steps:
      - name: send telega
        uses: appleboy/telegram-action@master
        with:
          # to: ${{ secrets.TELEGRAM_TO }}
          to: 360209578, phpcat,
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🍀🍀🍀 ${{ github.repository }} 
            ${{ github.event_name }} > ${{ github.event.head_commit.message }}
            👨🏻‍💻 ${{github.actor}} (${{ github.run_id }})
            ----
            🔧 Rebuild Needed: ${{ needs.deploy.outputs.rebuild_needed }}
            🖥️ 2503master Rebuild: ${{ needs.deploy.outputs.rebuild2305master }}
            🔐 Caddy Update: ${{ needs.deploy.outputs.rebuildCaddy }}
